name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"
      # The API tests start a real (in-memory) MongoDB. Cache its ~70MB binary
      # so it is downloaded once, not on every run.
      - uses: actions/cache@v4
        with:
          path: server/node_modules/.cache/mongodb-memory-server
          key: mongodb-memory-server-${{ hashFiles('server/package-lock.json') }}
      - run: npm run typecheck
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
